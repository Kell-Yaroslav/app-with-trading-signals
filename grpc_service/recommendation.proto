syntax = "proto3";

package recommendation;

// Описываем сервис
service RecommendationService {
  // 1.  Unary-метод
  rpc GetRecommendation (RecommendationRequest) returns (RecommendationResponse) {}

  // 2.  Server Streaming-метод
  rpc StreamRecommendations (StreamRequest) returns (stream RecommendationResponse) {}
}

// Входящие данные для Unary
message RecommendationRequest {
  string username = 1;
  repeated float profit_history = 2;
}

// сообщение для Streaming
message StreamRequest {
  string username = 1;
  repeated string timeframes = 2;
}

// Исходящие данные (используются в обоих методах)
message RecommendationResponse {
  int32 optimal_ema_period = 1;
  float optimal_target_pct = 2;
  float optimal_stop_pct = 3;
  string message = 4;
}